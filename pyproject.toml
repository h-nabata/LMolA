[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lmola"
version = "0.1.0a0"
description = "Local molecular structure agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "LMolA contributors"}]
dependencies = [
  "pydantic>=2.0",
  "PyYAML>=6.0",
  "numpy>=1.24",
  "ase>=3.22",
  "typer>=0.12",
  "rich>=13.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
agent = ["httpx>=0.27"]
chem = []
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]
all = ["httpx>=0.27", "pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
lmola = "lmola.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
  "external_tools: tests that require optional external tools",
]

[tool.ruff]
line-length = 100

