schema_version: lmola.phase17_existing_tool_depth_cases.v1
suite_id: phase17_existing_tool_depth_core_v1
description: Phase 17 existing-tool adapter depth dry-run and contract checks.
tags:
- phase17
- existing_tools
- adapter_depth
cases:
- case_id: xtb_singlepoint_dry_run
  language: en
  prompt: Run an xTB single point for examples/water.xyz with charge 0 and multiplicity 1 in water using ALPB. Do not optimize geometry.
  expected_status_any: [ok]
  expected_selected_workflow_id: xyz_to_xtb_singlepoint
  expected_operation: singlepoint_energy
  expected_requested_backend: xtb
  expected_input_roles: [primary_structure]
  expected_input_formats: [xyz]
  expected_parameter_bindings_contains: [charge, multiplicity, solvent.name, solvent.model]
  expected_expected_artifacts_contains: [xtb_singlepoint_result]
  expected_geometry_modified: false
  expected_can_create_dry_run_plan: true
  expected_can_execute: false
  expected_blocking_reasons_contains: []
  expected_unsupported_reasons_contains: []
  forbidden_workflow_ids: [xyz_to_xtb_relax, smiles_to_xtb_relax]
  expected_safety:
    execution_allowed: false
    dry_run_recommended: true
    requires_confirmation: true
    requires_allow_execution: true
- case_id: xtb_relax_dry_run
  language: en
  prompt: Relax examples/water.xyz with xTB using max 25 steps and force threshold 0.05.
  expected_status_any: [ok]
  expected_selected_workflow_id: xyz_to_xtb_relax
  expected_operation: geometry_optimization
  expected_requested_backend: xtb
  expected_input_roles: [primary_structure]
  expected_input_formats: [xyz]
  expected_parameter_bindings_contains: [geometry_optimization_controls.max_steps, geometry_optimization_controls.force_threshold]
  expected_expected_artifacts_contains: [optimized_geometry]
  expected_geometry_modified: true
  expected_can_create_dry_run_plan: true
  expected_can_execute: false
  expected_blocking_reasons_contains: []
  expected_unsupported_reasons_contains: []
  forbidden_workflow_ids: [xyz_to_xtb_singlepoint]
  expected_safety:
    execution_allowed: false
    dry_run_recommended: true
    requires_confirmation: true
    requires_allow_execution: true
