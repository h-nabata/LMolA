schema_version: lmola.morfeus_pilot_cases.v1
suite_id: morfeus_pilot_core_v1
description: Morfeus pilot integration cases for Phase 16.5.
tags: [phase16_5, morfeus, steric_descriptors, core]
cases:
  - case_id: en_morfeus_buried_volume_center_element
    language: en
    prompt: Calculate buried volume around Ni in examples/complex.xyz using morfeus.
    tags: [morfeus, buried_volume]
    expected_status_any: [ok]
    expected_selected_workflow_id: xyz_to_morfeus_buried_volume
    expected_operation: steric_descriptor_calculation
    expected_target_properties_contains: [buried_volume]
    expected_input_roles: [primary_structure]
    expected_parameter_bindings_contains: [center_atom, Ni, target_property, requested_backend]
    expected_expected_artifacts_contains: [morfeus_buried_volume_report]
    expected_geometry_modified: false
    expected_can_create_dry_run_plan: true
    expected_can_execute: false
    expected_blocking_reasons_contains: []
    expected_unsupported_reasons_contains: []
    forbidden_workflow_ids: [xyz_to_morfeus_cone_angle, xyz_to_morfeus_sterimol]
    forbidden_artifact_as_geometry: [morfeus_buried_volume_report]
    expected_safety: &safe {execution_allowed: false, dry_run_recommended: true, requires_confirmation: true, requires_allow_execution: true}
    notes: Complete buried-volume prompt using element center.
