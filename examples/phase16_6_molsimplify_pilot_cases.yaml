schema_version: lmola.molsimplify_pilot_cases.v1
suite_id: molsimplify_pilot_core_v1
description: molSimplify pilot integration cases for Phase 16.6.
tags:
- phase16_6
- molsimplify
- metal_complex_generation
- core
cases:
- case_id: en_molsimplify_fe_ammonia_octahedral
  language: en
  prompt: Build an octahedral Fe(II) complex with six ammonia ligands using molSimplify.
  tags:
  - phase16_6
  - molsimplify
  expected_status_any:
  - ok
  expected_selected_workflow_id: molsimplify_build_metal_complex
  expected_operation: metal_complex_generation
  expected_requested_backend: molsimplify
  expected_input_kind: metal_complex_build_request
  expected_parameter_bindings_contains:
  - metal
  - Fe
  - oxidation_state
  - '2'
  - coordination_geometry
  - octahedral
  - ligands
  - ammonia
  - count
  - '6'
  expected_expected_artifacts_contains:
  - molsimplify_complex_structure
  - molsimplify_build_report
  expected_geometry_modified: true
  expected_can_create_dry_run_plan: true
  expected_can_execute: false
  expected_blocking_reasons_contains: []
  expected_unsupported_reasons_contains: []
  forbidden_workflow_ids: []
  forbidden_artifact_as_geometry:
  - molsimplify_build_report
  expected_safety: &id001
    execution_allowed: false
    dry_run_recommended: true
    requires_confirmation: true
    requires_allow_execution: true
  notes: ''
